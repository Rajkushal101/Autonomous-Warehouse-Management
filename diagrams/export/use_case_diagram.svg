<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">UML Use Case Diagram: Autonomous Warehouse Management System</text>
  <text x="500" y="55" text-anchor="middle" font-size="12" fill="#64748b">24CYS401 Secure Software Engineering Lab Exam - Phase 3</text>

  <!-- System Boundary Box -->
  <rect x="220" y="70" width="560" height="660" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
  <text x="240" y="95" font-size="14" font-weight="bold" fill="#334155">Autonomous Warehouse Management System (System Boundary)</text>

  <!-- Left Actors (Humans) -->
  <!-- Customer -->
  <circle cx="90" cy="140" r="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <line x1="90" y1="156" x2="90" y2="185" stroke="#0284c7" stroke-width="2"/>
  <line x1="70" y1="168" x2="110" y2="168" stroke="#0284c7" stroke-width="2"/>
  <line x1="90" y1="185" x2="75" y2="210" stroke="#0284c7" stroke-width="2"/>
  <line x1="90" y1="185" x2="105" y2="210" stroke="#0284c7" stroke-width="2"/>
  <text x="90" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369a1">Customer</text>

  <!-- Operator -->
  <circle cx="90" cy="280" r="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <line x1="90" y1="296" x2="90" y2="325" stroke="#d97706" stroke-width="2"/>
  <line x1="70" y1="308" x2="110" y2="308" stroke="#d97706" stroke-width="2"/>
  <line x1="90" y1="325" x2="75" y2="350" stroke="#d97706" stroke-width="2"/>
  <line x1="90" y1="325" x2="105" y2="350" stroke="#d97706" stroke-width="2"/>
  <text x="90" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">Warehouse Operator</text>

  <!-- Manager -->
  <circle cx="90" cy="420" r="16" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <line x1="90" y1="436" x2="90" y2="465" stroke="#9333ea" stroke-width="2"/>
  <line x1="70" y1="448" x2="110" y2="448" stroke="#9333ea" stroke-width="2"/>
  <line x1="90" y1="465" x2="75" y2="490" stroke="#9333ea" stroke-width="2"/>
  <line x1="90" y1="465" x2="105" y2="490" stroke="#9333ea" stroke-width="2"/>
  <text x="90" y="505" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">Warehouse Manager</text>

  <!-- Administrator -->
  <circle cx="90" cy="560" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <line x1="90" y1="576" x2="90" y2="605" stroke="#dc2626" stroke-width="2"/>
  <line x1="70" y1="588" x2="110" y2="588" stroke="#dc2626" stroke-width="2"/>
  <line x1="90" y1="605" x2="75" y2="630" stroke="#dc2626" stroke-width="2"/>
  <line x1="90" y1="605" x2="105" y2="630" stroke="#dc2626" stroke-width="2"/>
  <text x="90" y="645" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">System Administrator</text>

  <!-- Right Actors -->
  <!-- Auditor -->
  <circle cx="910" cy="140" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <line x1="910" y1="156" x2="910" y2="185" stroke="#16a34a" stroke-width="2"/>
  <line x1="890" y1="168" x2="930" y2="168" stroke="#16a34a" stroke-width="2"/>
  <line x1="910" y1="185" x2="895" y2="210" stroke="#16a34a" stroke-width="2"/>
  <line x1="910" y1="185" x2="925" y2="210" stroke="#16a34a" stroke-width="2"/>
  <text x="910" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Security Auditor</text>

  <!-- Robot AGV Device -->
  <rect x="880" y="320" width="60" height="40" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <circle cx="895" cy="365" r="6" fill="#1e293b"/>
  <circle cx="925" cy="365" r="6" fill="#1e293b"/>
  <text x="910" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Robot AGV Device</text>

  <!-- Dispatcher Worker -->
  <rect x="875" y="470" width="70" height="35" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="910" y="492" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">&lt;&lt;Service&gt;&gt;</text>
  <text x="910" y="520" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Dispatcher</text>

  <!-- Use Cases Inside System -->
  <!-- UC-01 -->
  <ellipse cx="500" cy="115" rx="140" ry="22" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="500" y="119" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">UC-01: Authenticate &amp; End Session</text>

  <!-- UC-04 -->
  <ellipse cx="370" cy="180" rx="135" ry="24" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#0284c7">UC-04: Place Order &amp; Submit Request</text>

  <!-- Include Sub: Reserve Stock -->
  <ellipse cx="640" cy="180" rx="115" ry="20" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="640" y="184" text-anchor="middle" font-size="10.5" fill="#0369a1">&lt;&lt;include&gt;&gt; Reserve Stock Atomically</text>

  <!-- UC-03 -->
  <ellipse cx="370" cy="250" rx="135" ry="22" fill="#ffffff" stroke="#9333ea" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="370" y="254" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">UC-03: Manage Catalog &amp; Inventory</text>

  <!-- Include Sub: Stock Invariants -->
  <ellipse cx="640" cy="250" rx="115" ry="20" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="640" y="254" text-anchor="middle" font-size="10.5" fill="#7e22ce">&lt;&lt;include&gt;&gt; Validate Stock Invariants</text>

  <!-- UC-06 -->
  <ellipse cx="370" cy="335" rx="135" ry="24" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="339" text-anchor="middle" font-size="11" font-weight="bold" fill="#d97706">UC-06: Assign Robot &amp; Execute Task</text>

  <!-- Include Sub: Eligibility -->
  <ellipse cx="640" cy="320" rx="115" ry="20" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="640" y="324" text-anchor="middle" font-size="10.5" fill="#b45309">&lt;&lt;include&gt;&gt; Verify Robot Eligibility</text>

  <!-- Extend Sub: Collision/Fault -->
  <ellipse cx="640" cy="375" rx="115" ry="20" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="640" y="379" text-anchor="middle" font-size="10.5" fill="#b45309">&lt;&lt;extend&gt;&gt; Handle Collision / Stale Heartbeat</text>

  <!-- UC-05 -->
  <ellipse cx="490" cy="435" rx="130" ry="22" fill="#ffffff" stroke="#475569" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="490" y="439" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">UC-05: Register &amp; Maintain Robot</text>

  <!-- UC-07 -->
  <ellipse cx="370" cy="505" rx="135" ry="22" fill="#ffffff" stroke="#dc2626" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="370" y="509" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">UC-07: Cancel, Pause, Stop &amp; Recover</text>

  <!-- UC-08 -->
  <ellipse cx="630" cy="505" rx="115" ry="22" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="630" y="509" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">UC-08: View Fulfillment Results</text>

  <!-- UC-02 -->
  <ellipse cx="370" cy="580" rx="135" ry="22" fill="#ffffff" stroke="#dc2626" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="370" y="584" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">UC-02: Manage Users &amp; Roles</text>

  <!-- UC-09 -->
  <ellipse cx="500" cy="655" rx="140" ry="22" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="500" y="659" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">UC-09: Review Audit &amp; Health Telemetry</text>

  <!-- Connectors -->
  <!-- Include/Extend dashed connectors -->
  <line x1="505" y1="180" x2="525" y2="180" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dash)"/>
  <line x1="505" y1="250" x2="525" y2="250" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dash)"/>
  <line x1="505" y1="330" x2="525" y2="325" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dash)"/>
  <line x1="525" y1="370" x2="505" y2="345" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dash)"/>

  <!-- Association lines (Customer) -->
  <line x1="120" y1="160" x2="245" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="150" x2="365" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="175" x2="520" y2="500" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow)"/>

  <!-- Association lines (Operator) -->
  <line x1="125" y1="310" x2="240" y2="335" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="125" y1="300" x2="240" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="125" y1="320" x2="240" y2="500" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Association lines (Manager) -->
  <line x1="125" y1="440" x2="240" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="125" y1="450" x2="240" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="125" y1="460" x2="360" y2="435" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Association lines (Admin) -->
  <line x1="125" y1="590" x2="240" y2="580" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="125" y1="605" x2="360" y2="650" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Association lines (Auditor) -->
  <line x1="880" y1="175" x2="640" y2="655" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Association lines (Robot & Dispatcher) -->
  <line x1="880" y1="340" x2="505" y2="338" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="875" y1="485" x2="505" y2="345" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

</svg>
