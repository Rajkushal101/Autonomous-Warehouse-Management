<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 820" width="1150" height="820" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="dfd-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="dfd-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
    <marker id="dfd-arrow-audit" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="575" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Data Flow Diagram (DFD Level-1) with Trust Boundaries</text>
  <text x="575" y="52" text-anchor="middle" font-size="12" fill="#64748b">Autonomous Warehouse Orchestration, P4 Decomposition, and Data Layer (Phase 4)</text>

  <!-- Trust Boundary Boxes (Red Dashed Enclosures) -->
  <!-- TB1: Ingress Boundary -->
  <rect x="230" y="75" width="480" height="340" rx="10" fill="#f8fafc" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="245" y="65" width="220" height="20" fill="#fee2e2" rx="4"/>
  <text x="255" y="79" font-size="11" font-weight="bold" fill="#b91c1c">Trust Boundary TB1: Internet Ingress</text>

  <!-- TB3: Robot Device Boundary -->
  <rect x="740" y="75" width="370" height="340" rx="10" fill="#f8fafc" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="755" y="65" width="230" height="20" fill="#fee2e2" rx="4"/>
  <text x="765" y="79" font-size="11" font-weight="bold" fill="#b91c1c">Trust Boundary TB3: Machine Network</text>

  <!-- TB2: Protected Database Layer -->
  <rect x="230" y="440" width="880" height="220" rx="10" fill="#f1f5f9" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="245" y="430" width="230" height="20" fill="#fee2e2" rx="4"/>
  <text x="255" y="444" font-size="11" font-weight="bold" fill="#b91c1c">Trust Boundary TB2: Database Layer</text>

  <!-- TB5: Audit & Security Sink -->
  <rect x="230" y="685" width="880" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="245" y="675" width="220" height="20" fill="#fee2e2" rx="4"/>
  <text x="255" y="689" font-size="11" font-weight="bold" fill="#991b1b">Trust Boundary TB5: Audit Sink</text>

  <!-- External Entities -->
  <!-- E1: Customer Browser -->
  <g transform="translate(30, 100)" filter="url(#dfd-shadow)">
    <rect width="160" height="65" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="80" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369a1">E1: Customer</text>
    <text x="80" y="46" text-anchor="middle" font-size="10.5" fill="#0284c7">Web Browser</text>
  </g>

  <!-- E2: Operator Browser -->
  <g transform="translate(30, 210)" filter="url(#dfd-shadow)">
    <rect width="160" height="65" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="80" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">E2: Warehouse</text>
    <text x="80" y="46" text-anchor="middle" font-size="10.5" fill="#d97706">Operator / Manager</text>
  </g>

  <!-- E3: Auditor Browser -->
  <g transform="translate(30, 710)" filter="url(#dfd-shadow)">
    <rect width="160" height="65" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="80" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">E3: Security Auditor</text>
    <text x="80" y="46" text-anchor="middle" font-size="10.5" fill="#16a34a">Compliance Browser</text>
  </g>

  <!-- E4: Robot AGV -->
  <g transform="translate(980, 190)" filter="url(#dfd-shadow)">
    <rect width="140" height="70" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="70" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">E4: Robot AGV</text>
    <text x="70" y="50" text-anchor="middle" font-size="10.5" fill="#475569">Fleet Simulator</text>
  </g>

  <!-- Processes in TB1 -->
  <!-- P1: Authentication -->
  <g transform="translate(250, 100)" filter="url(#dfd-shadow)">
    <rect width="200" height="60" rx="25" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="100" y="27" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">P1: Authentication &amp;</text>
    <text x="100" y="43" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Access Policy</text>
  </g>

  <!-- P3: Order & Stock Reservation -->
  <g transform="translate(480, 100)" filter="url(#dfd-shadow)">
    <rect width="210" height="60" rx="25" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="105" y="27" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">P3: Order Validation &amp;</text>
    <text x="105" y="43" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Stock Reservation</text>
  </g>

  <!-- P2: Inventory & Catalog -->
  <g transform="translate(250, 210)" filter="url(#dfd-shadow)">
    <rect width="200" height="60" rx="25" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="100" y="27" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">P2: Catalog &amp;</text>
    <text x="100" y="43" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Inventory Management</text>
  </g>

  <!-- P5: Fulfillment Results -->
  <g transform="translate(480, 210)" filter="url(#dfd-shadow)">
    <rect width="210" height="60" rx="25" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="105" y="27" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">P5: Fulfillment Results</text>
    <text x="105" y="43" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">&amp; Reporting Engine</text>
  </g>

  <!-- Processes in TB3 (P4 Decomposed) -->
  <!-- P4.1: Robot Eligibility & Dispatch -->
  <g transform="translate(760, 100)" filter="url(#dfd-shadow)">
    <rect width="190" height="60" rx="25" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="95" y="27" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">P4.1: Eligibility &amp;</text>
    <text x="95" y="43" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Atomic Task Binding</text>
  </g>

  <!-- P4.2: Step Navigation & Collision Check -->
  <g transform="translate(760, 190)" filter="url(#dfd-shadow)">
    <rect width="190" height="60" rx="25" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="95" y="27" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">P4.2: Step Navigation</text>
    <text x="95" y="43" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">&amp; Collision Control</text>
  </g>

  <!-- P4.3: Pick & Drop Ledger Commit -->
  <g transform="translate(760, 280)" filter="url(#dfd-shadow)">
    <rect width="190" height="60" rx="25" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="95" y="27" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">P4.3: Pick &amp; Drop</text>
    <text x="95" y="43" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Ledger Commitment</text>
  </g>

  <!-- Data Stores in TB2 -->
  <!-- D1: Users & Sessions -->
  <g transform="translate(250, 480)" filter="url(#dfd-shadow)">
    <line x1="0" y1="0" x2="190" y2="0" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="50" x2="190" y2="50" stroke="#475569" stroke-width="2"/>
    <rect width="190" height="50" fill="#ffffff" opacity="0.8"/>
    <text x="95" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">D1: Users &amp; Sessions</text>
    <text x="95" y="38" text-anchor="middle" font-size="10" fill="#64748b">(Auth &amp; CSRF Digests)</text>
  </g>

  <!-- D2: Catalog & Ledger -->
  <g transform="translate(470, 480)" filter="url(#dfd-shadow)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="50" x2="200" y2="50" stroke="#475569" stroke-width="2"/>
    <rect width="200" height="50" fill="#ffffff" opacity="0.8"/>
    <text x="100" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">D2: Balances &amp; Ledger</text>
    <text x="100" y="38" text-anchor="middle" font-size="10" fill="#64748b">(Physical Inventory Truth)</text>
  </g>

  <!-- D3: Orders & Tasks -->
  <g transform="translate(700, 480)" filter="url(#dfd-shadow)">
    <line x1="0" y1="0" x2="190" y2="0" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="50" x2="190" y2="50" stroke="#475569" stroke-width="2"/>
    <rect width="190" height="50" fill="#ffffff" opacity="0.8"/>
    <text x="95" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">D3: Orders &amp; Tasks</text>
    <text x="95" y="38" text-anchor="middle" font-size="10" fill="#64748b">(Fulfillment Pipeline)</text>
  </g>

  <!-- D4: Robots & Commands -->
  <g transform="translate(915, 480)" filter="url(#dfd-shadow)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="50" x2="180" y2="50" stroke="#475569" stroke-width="2"/>
    <rect width="180" height="50" fill="#ffffff" opacity="0.8"/>
    <text x="90" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">D4: Fleet &amp; Commands</text>
    <text x="90" y="38" text-anchor="middle" font-size="10" fill="#64748b">(Grid Coordinates &amp; Queue)</text>
  </g>

  <!-- Process & Data Store in TB5 -->
  <!-- P6: Audit & Telemetry -->
  <g transform="translate(250, 715)" filter="url(#dfd-shadow)">
    <rect width="210" height="60" rx="25" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="105" y="27" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">P6: Audit Logging &amp;</text>
    <text x="105" y="43" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">Telemetry Monitor</text>
  </g>

  <!-- D5: Audit Events -->
  <g transform="translate(540, 720)" filter="url(#dfd-shadow)">
    <line x1="0" y1="0" x2="260" y2="0" stroke="#dc2626" stroke-width="2"/>
    <line x1="0" y1="50" x2="260" y2="50" stroke="#dc2626" stroke-width="2"/>
    <rect width="260" height="50" fill="#ffffff" opacity="0.9"/>
    <text x="130" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">D5: Security Audit Events</text>
    <text x="130" y="38" text-anchor="middle" font-size="10" fill="#dc2626">(Append-Only Forensic Ledger)</text>
  </g>

  <!-- Data Flow Arrows -->
  <!-- F01: Login -->
  <path d="M 190,130 L 250,130" stroke="#0284c7" stroke-width="1.8" marker-end="url(#dfd-arrow)"/>
  <text x="215" y="122" font-size="9.5" fill="#0369a1" text-anchor="middle">F01</text>

  <!-- F03: Order -->
  <path d="M 170,165 C 200,180 430,180 480,140" stroke="#0284c7" stroke-width="1.8" fill="none" marker-end="url(#dfd-arrow)"/>
  <text x="350" y="172" font-size="9.5" fill="#0369a1" text-anchor="middle">F03: Order (Idemp-Key)</text>

  <!-- F04: Reservation lock -->
  <path d="M 585,160 L 585,480" stroke="#0284c7" stroke-width="1.8" fill="none" marker-end="url(#dfd-arrow)"/>
  <text x="605" y="320" font-size="9.5" fill="#0369a1" text-anchor="middle">F04: Reserve</text>

  <!-- F05: Dispatch Request -->
  <path d="M 190,250 C 230,290 730,290 770,160" stroke="#0284c7" stroke-width="1.8" fill="none" marker-end="url(#dfd-arrow)"/>
  <text x="300" y="295" font-size="9.5" fill="#0369a1" text-anchor="middle">F05: Dispatch</text>

  <!-- F06 & F07: Robot Command / Telemetry -->
  <path d="M 980,225 L 950,225" stroke="#0284c7" stroke-width="1.8" marker-end="url(#dfd-arrow)"/>
  <text x="965" y="215" font-size="9.5" fill="#0369a1" text-anchor="middle">F07</text>

  <!-- F08: Pick & Drop Ledger Commit -->
  <path d="M 855,340 L 855,480" stroke="#0284c7" stroke-width="1.8" marker-end="url(#dfd-arrow)"/>
  <text x="875" y="420" font-size="9.5" fill="#0369a1" text-anchor="middle">F08: Commit</text>

  <!-- F10: Audit Log flows (Red) -->
  <path d="M 350,160 L 350,715" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#dfd-arrow-audit)"/>
  <path d="M 460,745 L 540,745" stroke="#dc2626" stroke-width="1.8" marker-end="url(#dfd-arrow-audit)"/>
  <text x="500" y="737" font-size="9.5" fill="#dc2626" text-anchor="middle">F10: Audit</text>

  <!-- F11: Review Audit -->
  <path d="M 190,745 L 250,745" stroke="#16a34a" stroke-width="1.8" marker-end="url(#dfd-arrow)"/>
  <text x="220" y="737" font-size="9.5" fill="#15803d" text-anchor="middle">F11</text>

</svg>
