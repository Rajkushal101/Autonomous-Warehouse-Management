<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 820" width="1150" height="820" style="background:#f8fafc; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="ui-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <text x="575" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">User Interface Wireframes &amp; Security Controls (Phase 6)</text>
  <text x="575" y="52" text-anchor="middle" font-size="12" fill="#64748b">Compliant with Mandel's Golden Rules &amp; Strict Role-Scoped Boundaries</text>

  <!-- Screen 1: UI-01 Login -->
  <g transform="translate(40, 75)" filter="url(#ui-shadow)">
    <rect width="320" height="320" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="320" height="32" rx="8" fill="#0284c7"/>
    <text x="160" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">UI-01: Secure Login Screen</text>
    
    <text x="25" y="65" font-size="11" font-weight="600" fill="#334155">Username / Email</text>
    <rect x="25" y="73" width="270" height="28" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="35" y="91" font-size="10.5" fill="#64748b">operator_alice</text>

    <text x="25" y="125" font-size="11" font-weight="600" fill="#334155">Password</text>
    <rect x="25" y="133" width="270" height="28" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="35" y="151" font-size="11" fill="#64748b">••••••••••••••••</text>

    <rect x="25" y="180" width="270" height="32" rx="4" fill="#0284c7"/>
    <text x="160" y="200" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Sign In Securely</text>

    <rect x="25" y="230" width="270" height="40" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="35" y="246" font-size="9.5" font-weight="bold" fill="#b91c1c">Security Notice:</text>
    <text x="35" y="260" font-size="9" fill="#7f1d1d">Generic errors only. Rate-limited at 5 failures/5min.</text>
    <text x="25" y="300" font-size="9.5" fill="#64748b">CSRF token verified. Argon2id / bcrypt hash.</text>
  </g>

  <!-- Screen 2: UI-02 Customer Order & Tracking -->
  <g transform="translate(415, 75)" filter="url(#ui-shadow)">
    <rect width="320" height="320" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="320" height="32" rx="8" fill="#0284c7"/>
    <text x="160" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">UI-02: Customer Order Screen (Exam Scr)</text>

    <text x="25" y="60" font-size="11" font-weight="600" fill="#334155">Select Warehouse Product</text>
    <rect x="25" y="68" width="270" height="26" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="35" y="85" font-size="10.5" fill="#1e293b">SKU-001: Precision Sensor ($45.00)</text>

    <text x="25" y="112" font-size="11" font-weight="600" fill="#334155">Quantity (Max: 100)</text>
    <rect x="25" y="120" width="100" height="26" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="35" y="137" font-size="10.5" fill="#1e293b">2</text>

    <rect x="140" y="120" width="155" height="26" rx="4" fill="#10b981"/>
    <text x="217" y="137" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">Reserve &amp; Place Order</text>

    <!-- Progress Tracker -->
    <text x="25" y="172" font-size="11" font-weight="bold" fill="#334155">Real-Time Fulfillment Tracker:</text>
    <rect x="25" y="185" width="50" height="20" rx="3" fill="#dcfce7"/>
    <text x="50" y="199" text-anchor="middle" font-size="9" font-weight="bold" fill="#16a34a">Ordered</text>
    <text x="80" y="199" font-size="9" fill="#94a3b8">→</text>
    <rect x="90" y="185" width="55" height="20" rx="3" fill="#dcfce7"/>
    <text x="117" y="199" text-anchor="middle" font-size="9" font-weight="bold" fill="#16a34a">Reserved</text>
    <text x="150" y="199" font-size="9" fill="#94a3b8">→</text>
    <rect x="160" y="185" width="55" height="20" rx="3" fill="#fef3c7"/>
    <text x="187" y="199" text-anchor="middle" font-size="9" font-weight="bold" fill="#d97706">Picking</text>
    <text x="220" y="199" font-size="9" fill="#94a3b8">→</text>
    <rect x="230" y="185" width="65" height="20" rx="3" fill="#f1f5f9"/>
    <text x="262" y="199" text-anchor="middle" font-size="9" fill="#64748b">Packing Bay</text>

    <rect x="25" y="225" width="270" height="50" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
    <text x="35" y="242" font-size="9.5" font-weight="bold" fill="#0369a1">Active Order #ORD-8419</text>
    <text x="35" y="257" font-size="9" fill="#0369a1">Robot AGV-01 en route to Shelf-A1 (Pos: 2, 4)</text>
    <text x="35" y="269" font-size="8.5" fill="#64748b">Idempotency Key: c74f... verified</text>

    <text x="25" y="300" font-size="9" fill="#64748b">Security: Customer ID derived from session (No IDOR).</text>
  </g>

  <!-- Screen 3: UI-03 Warehouse Management -->
  <g transform="translate(790, 75)" filter="url(#ui-shadow)">
    <rect width="320" height="320" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="320" height="32" rx="8" fill="#9333ea"/>
    <text x="160" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">UI-03: Inventory Console (Faculty Mgmt)</text>

    <text x="20" y="55" font-size="10.5" font-weight="bold" fill="#334155">Live Warehouse Inventory Balances:</text>
    <!-- Table Mock -->
    <rect x="20" y="65" width="280" height="85" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="30" y="80" font-size="9.5" font-weight="bold" fill="#475569">SKU</text>
    <text x="110" y="80" font-size="9.5" font-weight="bold" fill="#475569">On-Hand</text>
    <text x="175" y="80" font-size="9.5" font-weight="bold" fill="#475569">Reserved</text>
    <text x="240" y="80" font-size="9.5" font-weight="bold" fill="#475569">Available</text>
    <line x1="20" y1="86" x2="300" y2="86" stroke="#cbd5e1"/>
    <text x="30" y="102" font-size="9" fill="#1e293b">SKU-001</text>
    <text x="125" y="102" font-size="9" fill="#1e293b">50</text>
    <text x="190" y="102" font-size="9" fill="#d97706">2</text>
    <text x="255" y="102" font-size="9" font-weight="bold" fill="#16a34a">48</text>
    <line x1="20" y1="110" x2="300" y2="110" stroke="#f1f5f9"/>
    <text x="30" y="126" font-size="9" fill="#1e293b">SKU-002</text>
    <text x="125" y="126" font-size="9" fill="#1e293b">15</text>
    <text x="190" y="126" font-size="9" fill="#d97706">0</text>
    <text x="255" y="126" font-size="9" font-weight="bold" fill="#16a34a">15</text>

    <!-- Adjustment Section (Manager Only) -->
    <text x="20" y="170" font-size="10.5" font-weight="bold" fill="#9333ea">Manual Stock Adjustment (Manager Only):</text>
    <rect x="20" y="180" width="80" height="24" rx="3" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="30" y="196" font-size="9.5" fill="#64748b">Delta: +5</text>
    <rect x="110" y="180" width="190" height="24" rx="3" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="120" y="196" font-size="9" fill="#64748b">Reason: Supplier restock</text>

    <rect x="20" y="215" width="280" height="28" rx="4" fill="#9333ea"/>
    <text x="160" y="233" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">Commit Stock Adjustment</text>

    <rect x="20" y="255" width="280" height="45" rx="4" fill="#faf5ff" stroke="#c084fc"/>
    <text x="30" y="272" font-size="9" font-weight="bold" fill="#6b21a8">Security Invariant:</text>
    <text x="30" y="285" font-size="8.5" fill="#581c87">Adjustment cannot leave on_hand &lt; reserved.</text>
    <text x="30" y="296" font-size="8.5" fill="#581c87">Mandatory reason appended to inventory ledger.</text>
  </g>

  <!-- Bottom Row -->
  <!-- Screen 4: UI-04 Fulfillment Results -->
  <g transform="translate(40, 435)" filter="url(#ui-shadow)">
    <rect width="320" height="330" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="320" height="32" rx="8" fill="#10b981"/>
    <text x="160" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">UI-04: Fulfillment Results (Exam Results)</text>

    <text x="25" y="60" font-size="11" font-weight="bold" fill="#1e293b">Order Completion Receipt #ORD-8419</text>
    <rect x="25" y="70" width="270" height="180" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    
    <text x="40" y="95" font-size="10" fill="#64748b">Customer:</text>
    <text x="110" y="95" font-size="10" font-weight="bold" fill="#1e293b">customer_bob</text>

    <text x="40" y="115" font-size="10" fill="#64748b">Item:</text>
    <text x="110" y="115" font-size="10" font-weight="bold" fill="#1e293b">SKU-001 (Qty: 2)</text>

    <text x="40" y="135" font-size="10" fill="#64748b">Pickup Bay:</text>
    <text x="110" y="135" font-size="10" fill="#1e293b">Shelf-A1 (x=2, y=4)</text>

    <text x="40" y="155" font-size="10" fill="#64748b">Delivery Bay:</text>
    <text x="110" y="155" font-size="10" font-weight="bold" fill="#16a34a">Packing Bay 1 (x=1, y=9)</text>

    <text x="40" y="175" font-size="10" fill="#64748b">Fulfillment:</text>
    <text x="110" y="175" font-size="10" font-weight="bold" fill="#16a34a">COMPLETED</text>

    <text x="40" y="195" font-size="10" fill="#64748b">Robot Serial:</text>
    <text x="110" y="195" font-size="10" fill="#1e293b">AGV-01 (Task #TK-09)</text>

    <text x="40" y="215" font-size="10" fill="#64748b">Timestamp:</text>
    <text x="110" y="215" font-size="9.5" fill="#64748b">2026-10-08 10:14:22 UTC</text>

    <text x="40" y="235" font-size="10" fill="#64748b">Ledger Event:</text>
    <text x="110" y="235" font-size="9" fill="#0284c7">EVT-DROP-90214 (Committed)</text>

    <rect x="25" y="265" width="270" height="40" rx="4" fill="#ecfdf5" stroke="#10b981"/>
    <text x="35" y="282" font-size="9" font-weight="bold" fill="#047857">Delivery Proof Verified</text>
    <text x="35" y="295" font-size="8.5" fill="#065f46">Object-ownership checked. Other customers denied (403/404).</text>
  </g>

  <!-- Screen 5: UI-05 Robot Fleet Console -->
  <g transform="translate(415, 435)" filter="url(#ui-shadow)">
    <rect width="320" height="330" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="320" height="32" rx="8" fill="#d97706"/>
    <text x="160" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">UI-05: Robot Fleet &amp; Operations</text>

    <text x="25" y="55" font-size="10.5" font-weight="bold" fill="#334155">10x10 Discrete Warehouse Grid Map:</text>
    <!-- Map Canvas Mock -->
    <rect x="25" y="65" width="170" height="170" fill="#f8fafc" stroke="#cbd5e1"/>
    <!-- Grid markings -->
    <rect x="40" y="80" width="20" height="20" fill="#e2e8f0"/>
    <text x="50" y="94" font-size="8" text-anchor="middle" fill="#64748b">Obs</text>
    <rect x="80" y="100" width="22" height="22" rx="4" fill="#0284c7"/>
    <text x="91" y="115" font-size="8.5" text-anchor="middle" font-weight="bold" fill="#ffffff">R1</text>
    <rect x="140" y="160" width="22" height="22" rx="4" fill="#10b981"/>
    <text x="151" y="175" font-size="8.5" text-anchor="middle" font-weight="bold" fill="#ffffff">R2</text>
    <rect x="35" y="200" width="45" height="25" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="57" y="216" font-size="8" text-anchor="middle" font-weight="bold" fill="#b45309">Packing</text>

    <!-- Side Controls -->
    <rect x="205" y="65" width="95" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="212" y="80" font-size="9" font-weight="bold" fill="#1e293b">AGV-01: BUSY</text>
    <text x="212" y="95" font-size="8.5" fill="#64748b">Batt: 88% | (2,4)</text>

    <rect x="205" y="115" width="95" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="212" y="130" font-size="9" font-weight="bold" fill="#1e293b">AGV-02: IDLE</text>
    <text x="212" y="145" font-size="8.5" fill="#64748b">Batt: 95% | (8,1)</text>

    <rect x="205" y="165" width="95" height="32" rx="4" fill="#0284c7"/>
    <text x="252" y="184" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#ffffff">Dispatch</text>

    <rect x="205" y="205" width="95" height="30" rx="4" fill="#dc2626"/>
    <text x="252" y="224" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">HALT FLEET</text>

    <rect x="25" y="250" width="275" height="50" rx="4" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="35" y="267" font-size="9" font-weight="bold" fill="#b45309">Collision Control:</text>
    <text x="35" y="280" font-size="8.5" fill="#78350f">Mutual cell exclusion. Direct swap prohibited.</text>
    <text x="35" y="291" font-size="8.5" fill="#78350f">Offline if heartbeat elapsed &gt; 30 seconds.</text>
  </g>

  <!-- Screen 6: UI-06 Audit & Telemetry Log -->
  <g transform="translate(790, 435)" filter="url(#ui-shadow)">
    <rect width="320" height="330" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="320" height="32" rx="8" fill="#dc2626"/>
    <text x="160" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">UI-06: Security Audit &amp; Telemetry</text>

    <text x="20" y="55" font-size="10.5" font-weight="bold" fill="#334155">Append-Only Security Audit Trail:</text>
    
    <rect x="20" y="65" width="280" height="175" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="25" y="82" font-size="9" font-weight="bold" fill="#475569">UTC Time</text>
    <text x="100" y="82" font-size="9" font-weight="bold" fill="#475569">Actor</text>
    <text x="160" y="82" font-size="9" font-weight="bold" fill="#475569">Action</text>
    <text x="230" y="82" font-size="9" font-weight="bold" fill="#475569">Outcome</text>
    <line x1="20" y1="88" x2="300" y2="88" stroke="#cbd5e1"/>

    <text x="25" y="104" font-size="8" fill="#64748b">10:11:05</text>
    <text x="100" y="104" font-size="8" fill="#1e293b">bob (CUST)</text>
    <text x="160" y="104" font-size="8" fill="#1e293b">ORDER_CREATE</text>
    <text x="230" y="104" font-size="8" font-weight="bold" fill="#16a34a">SUCCESS</text>

    <text x="25" y="124" font-size="8" fill="#64748b">10:12:14</text>
    <text x="100" y="124" font-size="8" fill="#1e293b">alice (OPR)</text>
    <text x="160" y="124" font-size="8" fill="#1e293b">TASK_ASSIGN</text>
    <text x="230" y="124" font-size="8" font-weight="bold" fill="#16a34a">SUCCESS</text>

    <text x="25" y="144" font-size="8" fill="#64748b">10:13:50</text>
    <text x="100" y="144" font-size="8" fill="#b91c1c">eve (ATTACK)</text>
    <text x="160" y="144" font-size="8" fill="#b91c1c">STOCK_ADJUST</text>
    <text x="230" y="144" font-size="8" font-weight="bold" fill="#dc2626">DENIED (403)</text>

    <text x="25" y="164" font-size="8" fill="#64748b">10:14:02</text>
    <text x="100" y="144" font-size="8" fill="#1e293b">AGV-01</text>
    <text x="160" y="164" font-size="8" fill="#1e293b">PACKING_DROP</text>
    <text x="230" y="164" font-size="8" font-weight="bold" fill="#16a34a">SUCCESS</text>

    <rect x="20" y="255" width="280" height="50" rx="4" fill="#fef2f2" stroke="#dc2626"/>
    <text x="30" y="272" font-size="9" font-weight="bold" fill="#991b1b">Immutable Compliance Controls:</text>
    <text x="30" y="285" font-size="8.5" fill="#7f1d1d">Zero UPDATE/DELETE operations permitted.</text>
    <text x="30" y="296" font-size="8.5" fill="#7f1d1d">Read-only view for AUDITOR and ADMIN.</text>
  </g>

</svg>
