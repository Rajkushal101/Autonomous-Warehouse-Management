# Bandit static analysis configuration for Autonomous Warehouse System
profiles:
  warehouse_security_profile:
    include:
      - any_other_function_with_shell_equals_true
      - assert_used
      - hardcoded_password_string
      - hardcoded_sql_expressions
      - subprocess_popen_with_shell_equals_true
      - sql_injection

skips: ['B101']  # Skip assert check used in validation/typing tests

exclude_dirs:
  - '.venv'
  - 'venv'
  - 'tests'
  - '.pytest_cache'
  - '.hypothesis'
