apiVersion: apps/v1
kind: Deployment
metadata:
  name: awms-postgres
  namespace: warehouse-lab
  labels:
    app: awms-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: awms-postgres
  template:
    metadata:
      labels:
        app: awms-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "warehouse_app"
            - name: POSTGRES_DB
              value: "warehouse_db"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: awms-secrets
                  key: DB_PASSWORD
                  optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: awms-postgres
  namespace: warehouse-lab
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: awms-postgres
